<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRADE PRO AI</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#172033;font-family:Arial,sans-serif}
header{padding:18px;border-bottom:1px solid #ddd;font-size:25px;font-weight:bold}
header span{color:#1677ff}
main{max-width:1200px;margin:auto;padding:15px}
.panel{border:1px solid #e2e6ed;border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:19px;margin-top:0}
select,input,button{
padding:12px;border:1px solid #ddd;border-radius:8px;
background:white;font-size:14px;margin:4px;max-width:100%
}
button{background:#1677ff;color:white;border:0;font-weight:bold;cursor:pointer}
.market-buttons{display:flex;flex-wrap:wrap;gap:7px}
.market-buttons button{flex:1}
#chart{width:100%;height:500px}
#pairList button,#watchlist button{
background:#f1f5f9;color:#172033;border:1px solid #ddd;
margin:4px;padding:9px
}
#pairList button.active{border-color:#1677ff}
#watchlist button{background:#eaf2ff}
.signal{text-align:center;font-size:35px;font-weight:bold;padding:20px}
#status{font-size:13px;color:#666}
footer{text-align:center;padding:20px;color:#777}
@media(max-width:600px){
#chart{height:400px}
header{font-size:22px}
}
</style>
</head>

<body>

<header>TRADE <span>PRO AI</span></header>

<main>

<div class="panel">
<h2>Market Selection</h2>

<div class="market-buttons">
<button onclick="changeMarket('Crypto')">Crypto</button>
<button onclick="changeMarket('Forex')">Forex</button>
<button onclick="changeMarket('Stocks')">Stocks</button>
<button onclick="changeMarket('Gold')">Gold</button>
<button onclick="changeMarket('Commodities')">Commodities</button>
</div>

<br>

<input id="search" placeholder="Search pair or company..."
oninput="renderPairs()" style="width:95%">

<div id="pairList"></div>

<p id="status">Loading market list...</p>

<h2>Selected Market</h2>
<select id="symbol" onchange="loadChart()"></select>

<button onclick="addFavorite()">⭐ Add Favorite</button>

<select id="timeframe" onchange="loadChart()">
<option value="1">1 Minute</option>
<option value="5">5 Minutes</option>
<option value="15">15 Minutes</option>
<option value="30">30 Minutes</option>
<option value="60">1 Hour</option>
<option value="240">4 Hours</option>
<option value="D">1 Day</option>
<option value="W">1 Week</option>
</select>
</div>

<div class="panel">
<h2>My Watchlist ⭐</h2>
<div id="watchlist">No favorite pairs saved.</div>
</div>

<div class="panel">
<h2>Live Trading Chart</h2>
<div id="chart"></div>
</div>

<div class="panel">
<h2>Technical Analysis</h2>
<div class="signal" id="signal">WAIT</div>
<p id="message">Analysis engine is not connected yet.</p>
<button onclick="generateAnalysis()">Generate Analysis</button>
</div>

</main>

<footer>
TRADE PRO AI | Professional Market Analysis
<br><br>Trading involves financial risk.
</footer>

<script>

const markets={

Forex:[
["EUR/USD","OANDA:EURUSD"],
["GBP/USD","OANDA:GBPUSD"],
["USD/JPY","OANDA:USDJPY"],
["AUD/USD","OANDA:AUDUSD"],
["USD/CAD","OANDA:USDCAD"],
["USD/CHF","OANDA:USDCHF"],
["NZD/USD","OANDA:NZDUSD"],
["EUR/GBP","OANDA:EURGBP"],
["EUR/JPY","OANDA:EURJPY"],
["GBP/JPY","OANDA:GBPJPY"],
["EUR/AUD","OANDA:EURAUD"],
["EUR/CAD","OANDA:EURCAD"],
["EUR/CHF","OANDA:EURCHF"],
["GBP/AUD","OANDA:GBPAUD"],
["GBP/CAD","OANDA:GBPCAD"],
["AUD/JPY","OANDA:AUDJPY"],
["CAD/JPY","OANDA:CADJPY"],
["CHF/JPY","OANDA:CHFJPY"]
],

Stocks:[
["Apple","NASDAQ:AAPL"],
["Microsoft","NASDAQ:MSFT"],
["NVIDIA","NASDAQ:NVDA"],
["Amazon","NASDAQ:AMZN"],
["Google","NASDAQ:GOOGL"],
["Meta","NASDAQ:META"],
["Tesla","NASDAQ:TSLA"],
["Netflix","NASDAQ:NFLX"],
["Reliance","NSE:RELIANCE"],
["TCS","NSE:TCS"],
["HDFC Bank","NSE:HDFCBANK"],
["ICICI Bank","NSE:ICICIBANK"],
["Infosys","NSE:INFY"],
["Wipro","NSE:WIPRO"],
["Tata Motors","NSE:TATAMOTORS"],
["ITC","NSE:ITC"],
["SBI","NSE:SBIN"],
["Bharti Airtel","NSE:BHARTIARTL"],
["Adani Enterprises","NSE:ADANIENT"],
["Larsen & Toubro","NSE:LT"]
],

Gold:[
["Gold / USD","OANDA:XAUUSD"]
],

Commodities:[
["Silver","OANDA:XAGUSD"],
["Crude Oil","TVC:USOIL"],
["Natural Gas","NYMEX:NG1!"],
["Brent Oil","TVC:UKOIL"],
["Copper","COMEX:HG1!"]
]

};

let currentMarket="Forex";
let allCryptoPairs=[];
let currentPairs=[];
let favorites=JSON.parse(localStorage.getItem("tradeFavorites")||"[]");

function saveFavorites(){
 localStorage.setItem("tradeFavorites",JSON.stringify(favorites));
 renderWatchlist();
}

function changeMarket(market){
 currentMarket=market;
 document.getElementById("search").value="";

 if(market==="Crypto"){
  if(allCryptoPairs.length){
   currentPairs=allCryptoPairs;
   renderPairs();
  }else{
   loadCryptoPairs();
  }
 }else{
  currentPairs=markets[market];
  renderPairs();
 }
}

async function loadCryptoPairs(){

 const status=document.getElementById("status");
 status.innerText="Loading Binance USDT Spot pairs...";

 try{
  const response=await fetch(
   "https://api.binance.com/api/v3/exchangeInfo"
  );

  if(!response.ok)throw new Error("API unavailable");

  const data=await response.json();

  allCryptoPairs=data.symbols
   .filter(s=>
    s.quoteAsset==="USDT" &&
    s.status==="TRADING" &&
    s.isSpotTradingAllowed
   )
   .map(s=>[
    s.baseAsset+"/USDT",
    "BINANCE:"+s.symbol
   ])
   .sort((a,b)=>a[0].localeCompare(b[0]));

  currentPairs=allCryptoPairs;
  status.innerText=allCryptoPairs.length+" Crypto pairs loaded";

  renderPairs();

 }catch(error){

  allCryptoPairs=[
   ["BTC/USDT","BINANCE:BTCUSDT"],
   ["ETH/USDT","BINANCE:ETHUSDT"],
   ["BNB/USDT","BINANCE:BNBUSDT"],
   ["SOL/USDT","BINANCE:SOLUSDT"],
   ["XRP/USDT","BINANCE:XRPUSDT"],
   ["DOGE/USDT","BINANCE:DOGEUSDT"],
   ["ADA/USDT","BINANCE:ADAUSDT"]
  ];

  currentPairs=allCryptoPairs;
  status.innerText="Binance unavailable. Backup pairs shown.";
  renderPairs();
 }
}

function renderPairs(){

 const query=document.getElementById("search").value.toUpperCase();
 const box=document.getElementById("pairList");

 const filtered=currentPairs.filter(p=>
  p[0].toUpperCase().includes(query)||
  p[1].toUpperCase().includes(query)
 );

 box.innerHTML="";

 filtered.forEach(pair=>{

  const btn=document.createElement("button");
  btn.textContent=pair[0];
  btn.onclick=()=>selectPair(pair);

  box.appendChild(btn);
 });

 if(filtered.length===0){
  box.innerText="No matching pairs found.";
 }
}

function selectPair(pair){

 const select=document.getElementById("symbol");
 select.innerHTML="";

 const option=document.createElement("option");
 option.value=pair[1];
 option.textContent=pair[0];
 select.appendChild(option);

 loadChart();
}

function addFavorite(){

 const select=document.getElementById("symbol");
 if(!select.value){
  alert("Please select a pair first.");
  return;
 }

 const name=select.options[0].textContent;
 const symbol=select.value;

 if(favorites.some(f=>f.symbol===symbol)){
  alert("Already saved in Watchlist.");
  return;
 }

 favorites.push({name,symbol});
 saveFavorites();

 alert("Added to Watchlist!");
}

function renderWatchlist(){

 const box=document.getElementById("watchlist");
 box.innerHTML="";

 if(favorites.length===0){
  box.innerText="No favorite pairs saved.";
  return;
 }

 favorites.forEach((item,index)=>{

  const btn=document.createElement("button");
  btn.textContent="⭐ "+item.name;

  btn.onclick=()=>selectPair([item.name,item.symbol]);

  const remove=document.createElement("button");
  remove.textContent="✕";
  remove.onclick=()=>{
   favorites.splice(index,1);
   saveFavorites();
  };

  box.appendChild(btn);
  box.appendChild(remove);
 });
}

function loadChart(){

 const symbol=document.getElementById("symbol").value;
 const interval=document.getElementById("timeframe").value;
 const chart=document.getElementById("chart");

 if(!symbol)return;

 chart.innerHTML="";

 const container=document.createElement("div");
 container.className="tradingview-widget-container";
 container.style.height="100%";
 container.style.width="100%";

 const widget=document.createElement("div");
 widget.className="tradingview-widget-container__widget";
 widget.style.height="100%";
 widget.style.width="100%";

 const script=document.createElement("script");
 script.type="text/javascript";
 script.async=true;
 script.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";

 script.textContent=JSON.stringify({
  autosize:true,
  symbol:symbol,
  interval:interval,
  timezone:"Asia/Kolkata",
  theme:"light",
  style:"1",
  locale:"en",
  allow_symbol_change:true,
  calendar:false,
  support_host:"https://www.tradingview.com"
 });

 container.appendChild(widget);
 container.appendChild(script);
 chart.appendChild(container);
}

function generateAnalysis(){
 document.getElementById("signal").innerText="WAIT";
 document.getElementById("message").innerText=
 "Technical analysis engine is not connected yet. No live signal generated.";
}

renderWatchlist();
changeMarket("Forex");

</script>

</body>
</html>
