<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRADE PRO AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#fff;color:#172033;
 font-family:Arial,sans-serif
}
header{
 padding:18px;border-bottom:1px solid #ddd;
 font-size:25px;font-weight:bold
}
header span{color:#1677ff}
main{max-width:1200px;margin:auto;padding:15px}
.panel{
 background:white;border:1px solid #e2e6ed;
 border-radius:12px;padding:16px;margin-bottom:16px
}
h2{font-size:19px;margin-top:0}
select,input,button{
 padding:12px;border:1px solid #ddd;
 border-radius:8px;background:white;
 font-size:14px;margin:4px;max-width:100%
}
button{
 background:#1677ff;color:white;
 border:0;font-weight:bold;cursor:pointer
}
.market-buttons{display:flex;flex-wrap:wrap;gap:7px}
.market-buttons button{flex:1}
#chart{width:100%;height:500px}
.signal{
 text-align:center;font-size:35px;
 font-weight:bold;padding:20px
}
#status{font-size:13px;color:#666}
footer{text-align:center;padding:20px;color:#777}
@media(max-width:600px){
 #chart{height:400px}
 header{font-size:22px}
}
</style>
</head>

<body>

<header>TRADE <span>PRO AI</span></header>

<main>

<div class="panel">
<h2>Market Selection</h2>

<div class="market-buttons">
<button onclick="changeMarket('Forex')">Forex</button>
<button onclick="changeMarket('Crypto')">Crypto</button>
<button onclick="changeMarket('Stocks')">Stocks</button>
<button onclick="changeMarket('Gold')">Gold</button>
</div>

<br>

<input id="searchPair" placeholder="Search trading pair..."
oninput="filterPairs()" style="width:95%;display:none">

<br>

<select id="symbol" onchange="loadChart()"></select>

<select id="timeframe" onchange="loadChart()">
<option value="1">1 Minute</option>
<option value="5">5 Minutes</option>
<option value="15">15 Minutes</option>
<option value="30">30 Minutes</option>
<option value="60">1 Hour</option>
<option value="240">4 Hours</option>
<option value="D">1 Day</option>
<option value="W">1 Week</option>
</select>

<p id="status">Ready</p>
</div>

<div class="panel">
<h2>Live Trading Chart</h2>
<div id="chart"></div>
</div>

<div class="panel">
<h2>Technical Analysis</h2>
<div class="signal" id="signal">WAIT</div>
<p id="message">
Analysis engine is not connected yet.
</p>
<button onclick="generateAnalysis()">Generate Analysis</button>
</div>

</main>

<footer>
TRADE PRO AI | Professional Market Analysis
<br><br>
Trading involves financial risk.
</footer>

<script>

const markets={
 Forex:[
  ["EUR/USD","OANDA:EURUSD"],
  ["GBP/USD","OANDA:GBPUSD"],
  ["USD/JPY","OANDA:USDJPY"],
  ["AUD/USD","OANDA:AUDUSD"],
  ["USD/CAD","OANDA:USDCAD"],
  ["USD/CHF","OANDA:USDCHF"],
  ["NZD/USD","OANDA:NZDUSD"],
  ["EUR/GBP","OANDA:EURGBP"],
  ["EUR/JPY","OANDA:EURJPY"],
  ["GBP/JPY","OANDA:GBPJPY"]
 ],
 Stocks:[
  ["Apple","NASDAQ:AAPL"],
  ["Microsoft","NASDAQ:MSFT"],
  ["Tesla","NASDAQ:TSLA"],
  ["NVIDIA","NASDAQ:NVDA"],
  ["Amazon","NASDAQ:AMZN"],
  ["Google","NASDAQ:GOOGL"],
  ["Meta","NASDAQ:META"],
  ["Netflix","NASDAQ:NFLX"]
 ],
 Gold:[
  ["Gold / USD","OANDA:XAUUSD"]
 ]
};

let currentMarket="Forex";
let allCryptoPairs=[];

function fillSelect(pairs){
 const select=document.getElementById("symbol");
 select.innerHTML="";

 pairs.forEach(pair=>{
  const option=document.createElement("option");
  option.textContent=pair[0];
  option.value=pair[1];
  select.appendChild(option);
 });

 if(pairs.length) loadChart();
}

async function loadCryptoPairs(){
 const status=document.getElementById("status");
 status.innerText="Loading Binance USDT pairs...";

 try{
  const response=await fetch(
   "https://api.binance.com/api/v3/exchangeInfo"
  );

  if(!response.ok) throw new Error("API unavailable");

  const data=await response.json();

  allCryptoPairs=data.symbols
   .filter(s=>
    s.quoteAsset==="USDT" &&
    s.status==="TRADING" &&
    s.isSpotTradingAllowed
   )
   .map(s=>[
    s.baseAsset+"/USDT",
    "BINANCE:"+s.symbol
   ])
   .sort((a,b)=>a[0].localeCompare(b[0]));

  status.innerText=
   allCryptoPairs.length+" USDT Spot pairs loaded";

  fillSelect(allCryptoPairs);

 }catch(error){
  status.innerText="Could not load Binance pairs. Showing backup list.";

  allCryptoPairs=[
   ["BTC/USDT","BINANCE:BTCUSDT"],
   ["ETH/USDT","BINANCE:ETHUSDT"],
   ["BNB/USDT","BINANCE:BNBUSDT"],
   ["SOL/USDT","BINANCE:SOLUSDT"],
   ["XRP/USDT","BINANCE:XRPUSDT"],
   ["DOGE/USDT","BINANCE:DOGEUSDT"],
   ["ADA/USDT","BINANCE:ADAUSDT"]
  ];

  fillSelect(allCryptoPairs);
 }
}

function changeMarket(market){
 currentMarket=market;

 const search=document.getElementById("searchPair");

 if(market==="Crypto"){
  search.style.display="block";
  if(allCryptoPairs.length){
   fillSelect(allCryptoPairs);
  }else{
   loadCryptoPairs();
  }
 }else{
  search.style.display="none";
  document.getElementById("status").innerText="Ready";
  fillSelect(markets[market]);
 }
}

function filterPairs(){
 const query=document.getElementById("searchPair")
  .value.toUpperCase();

 const filtered=allCryptoPairs.filter(pair=>
  pair[0].includes(query)
 );

 fillSelect(filtered);
}

function loadChart(){
 const symbol=document.getElementById("symbol").value;
 const interval=document.getElementById("timeframe").value;
 const chart=document.getElementById("chart");

 if(!symbol)return;

 chart.innerHTML=
 '<div class="tradingview-widget-container__widget"></div>';

 const script=document.createElement("script");
 script.type="text/javascript";
 script.async=true;
 script.src=
 "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";

 script.textContent=JSON.stringify({
  autosize:true,
  symbol:symbol,
  interval:interval,
  timezone:"Asia/Kolkata",
  theme:"light",
  style:"1",
  locale:"en",
  allow_symbol_change:true,
  calendar:false,
  support_host:"https://www.tradingview.com"
 });

 chart.appendChild(script);
}

function generateAnalysis(){
 document.getElementById("signal").innerText="WAIT";
 document.getElementById("message").innerText=
 "Technical analysis engine is not connected yet. No live signal generated.";
}

changeMarket("Forex");

</script>

</body>
</html>
