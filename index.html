<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRADE PRO AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #ffffff;
      padding: 20px;
      border-bottom: 1px solid #ddd;
      font-size: 24px;
      font-weight: bold;
    }

    header span {
      color: #1677ff;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 15px;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px #00000008;
    }

    select, button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin: 5px;
      font-size: 15px;
    }

    button {
      background: #1677ff;
      color: white;
      border: none;
      cursor: pointer;
    }

    .chart {
      height: 350px;
      border: 1px solid #ddd;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #777;
      background: white;
    }

    .signal {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      padding: 25px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  TRADE <span>PRO AI</span>
</header>

<main>

  <div class="panel">
    <h2>Market Analysis</h2>

    <select id="market">
      <option>Forex</option>
      <option>Crypto</option>
      <option>Stocks</option>
      <option>Gold</option>
    </select>

    <select id="timeframe">
      <option>1 Minute</option>
      <option>5 Minutes</option>
      <option>15 Minutes</option>
      <option>30 Minutes</option>
      <option>1 Hour</option>
      <option>4 Hours</option>
      <option>1 Day</option>
      <option>1 Week</option>
    </select>
  </div>

  <div class="panel">
    <h2>Trading Chart</h2>
    <div class="chart">
      Chart will appear here after data connection.
    </div>
  </div>

  <div class="panel">
    <h2>AI Trading Analysis</h2>

    <div class="signal" id="signal">
      WAIT
    </div>

    <button onclick="showMessage()">
      Generate Analysis
    </button>

    <p id="message">
      Connect a market data source to begin analysis.
    </p>
  </div>

</main>

<footer>
  TRADE PRO AI | Market Analysis Platform
  <br>
  Trading involves risk. No guaranteed profits.
</footer>

<script>
  function showMessage() {
    document.getElementById("signal").innerText = "WAIT";
    document.getElementById("message").innerText =
      "Live market data is not connected yet.";
  }
</script>

</body>
</html>
